version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev_2026
      POSTGRES_DB: finance_hub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-hub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://finance:finance_dev_2026@postgres:5432/finance_hub
      DIRECT_URL: postgresql://finance:finance_dev_2026@postgres:5432/finance_hub
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production-use-openssl-rand-base64-32
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
